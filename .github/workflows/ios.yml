name: iOS build

# Builds the App Store version with Capacitor on a GitHub macOS runner.
# Until an Apple Developer account and signing certificates exist, this compiles an
# unsigned simulator build to prove the project is healthy. The signed App Store /
# TestFlight step is added once the account is set up.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'store/**', 'content/SCHEMA.md']

permissions:
  contents: write # to publish the simulator zip to the "ios-simulator" release

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Build web assets and iOS project
        run: |
          npm run build
          npx cap add ios
          npx capacitor-assets generate --ios --iconBackgroundColor "#FFFFFF" --splashBackgroundColor "#FBF8F4" --splashBackgroundColorDark "#14191D"
          npx cap sync ios

      - name: Compile for the iOS simulator (unsigned)
        working-directory: ios/App
        run: |
          set -o pipefail
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build | tail -n 40

      # A zipped simulator app that can be uploaded to Appetize.io to try the iPhone
      # version in a web browser, without a Mac or an Apple Developer account.
      - name: Package simulator app for Appetize.io
        run: |
          cd "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator"
          ditto -c -k --sequesterRsrc --keepParent App.app "$GITHUB_WORKSPACE/4everyone-ios-simulator.zip"
          ls -la "$GITHUB_WORKSPACE/4everyone-ios-simulator.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: 4everyone-ios-simulator
          path: 4everyone-ios-simulator.zip

      # Same zip at a fixed public link (a GitHub Release asset), so it can be uploaded to
      # Appetize.io as-is: no sign-in, no double zip.
      - name: Publish simulator app to the "ios-simulator" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-simulator >/dev/null 2>&1 || gh release create ios-simulator \
            --prerelease --title "iOS simulator build (for Appetize.io)" \
            --notes "Latest iPhone simulator build of the app, for testing on Appetize.io. Upload 4everyone-ios-simulator.zip as-is. Not for the App Store."
          gh release upload ios-simulator 4everyone-ios-simulator.zip --clobber
          echo "Download: https://github.com/${{ github.repository }}/releases/download/ios-simulator/4everyone-ios-simulator.zip"
